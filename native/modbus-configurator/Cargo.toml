[workspace]
resolver = "3"

[package]
name = "modbus-configurator"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
arboard = { version = "=3.6.1", default-features = false }
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serialport = "=4.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "=1.4.0"
rfd = "=0.15.4"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_System_SystemInformation", "Win32_Globalization"] }

[profile.release]
lto = "thin"
# Keep release performance while retaining symbols and runtime diagnostic checks.
debug = 2
strip = false
debug-assertions = true
overflow-checks = true
panic = "unwind"
