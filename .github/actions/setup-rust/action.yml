name: Prepare cached Rust job
description: Install the pinned toolchain and restore dependencies and job-specific build outputs.
inputs:
  kind:
    description: Cache namespace for this job.
    required: true
  target-path:
    description: Compiled-output directory; never include coverage reports or raw profiles.
    required: true
  components:
    description: Comma-separated rustup components.
    required: true
  coverage:
    description: Install cargo-llvm-cov for this job.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain
      shell: pwsh
      env:
        COMPONENTS: ${{ inputs.components }}
      run: |
        rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component $env:COMPONENTS
        if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
    - name: Cache Cargo downloads
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/registry/src
          ~/.cargo/git/db
          ~/.cargo/git/checkouts
        key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/modbus-configurator/Cargo.lock') }}
        restore-keys: cargo-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Cache compiled dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ inputs.target-path }}
        key: build-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ inputs.kind }}-${{ hashFiles('native/modbus-configurator/Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          build-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ inputs.kind }}-${{ hashFiles('native/modbus-configurator/Cargo.lock') }}-
    - name: Cache coverage tool
      if: inputs.coverage == 'true'
      id: coverage-tool
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: native/modbus-configurator/target/coverage-tools
        key: llvm-cov-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-0.9.1
    - name: Install coverage tool on cache miss
      if: inputs.coverage == 'true' && steps.coverage-tool.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        cargo +$env:RUST_TOOLCHAIN install cargo-llvm-cov --version 0.9.1 --locked --root native/modbus-configurator/target/coverage-tools
        if ($LASTEXITCODE -ne 0) { throw 'Coverage tool installation failed.' }
    - name: Fetch locked dependencies
      shell: pwsh
      run: |
        cargo +$env:RUST_TOOLCHAIN fetch --manifest-path native/modbus-configurator/Cargo.toml --locked
        if ($LASTEXITCODE -ne 0) { throw 'Locked dependency fetch failed.' }
