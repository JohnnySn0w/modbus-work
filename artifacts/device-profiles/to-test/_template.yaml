preflight_blockers:
  - Exact device and firmware identity are missing.
  - Applicable authoritative register map is not bound to the profile.
  - Serial settings and address convention are not live-validated.
  - Measurement decoding and scaling are not live-validated.
  - Exact bridge firmware and configuration are not validated.
  - Loriot payload is not captured and decoded.

test_sequence:
  - Photograph labels, connectors, wiring, and power arrangement.
  - Record exact device identity and firmware.
  - Snapshot device and bridge configuration before writes.
  - Confirm communications using safe identity or measurement reads.
  - Validate address convention, data types, byte order, word order, scale, and units.
  - Compare engineering values with a trusted reference or plausible test condition.
  - Compile the selected points into a backed-up bridge.
  - Read back and diff the bridge configuration.
  - Confirm local point reads.
  - Capture and decode the Loriot raw payload.

promotion_requirements:
  target_status: bench-validated
  require_all_preflight_blockers_cleared: true
  require_device_model_and_firmware: true
  require_source_revisions: true
  require_live_modbus_evidence: true
  require_bridge_model_and_firmware_for_bridge_validation: true
  require_loriot_payload_for_clone_ready: true
  allow_technician_deployment_before_clone_ready: false

